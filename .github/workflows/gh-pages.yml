name: Deploy site to GitHub Pages

# One Pages site per repository: the Next.js web frontend at /vulquantafs/ and
# the Docusaurus documentation at /vulquantafs/docs/, assembled into a single
# artifact below.

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            ./vulquantafs-gh-pages/package-lock.json
            ./docusaurus/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          static_site_generator: next

      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: |
            ./vulquantafs-gh-pages/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('./vulquantafs-gh-pages/package-lock.json') }}-${{ hashFiles('./vulquantafs-gh-pages/**/*.js', './vulquantafs-gh-pages/**/*.jsx', './vulquantafs-gh-pages/**/*.ts', './vulquantafs-gh-pages/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('./vulquantafs-gh-pages/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci
        working-directory: ./vulquantafs-gh-pages

      - name: Build with Next.js
        run: npm run build
        working-directory: ./vulquantafs-gh-pages
        # next.config.ts derives the Docker images and the Pages URL shown in
        # the config generator and the guides from these.
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}

      - name: Install documentation dependencies
        run: npm ci
        working-directory: ./docusaurus

      - name: Build the documentation
        run: npm run build
        working-directory: ./docusaurus
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}

      - name: Assemble the Pages artifact
        run: |
          mkdir -p site
          cp -r vulquantafs-gh-pages/out/. site/
          cp -r docusaurus/build/. site/docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5