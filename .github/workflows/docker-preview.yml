# Preview images for feature branches.
#
# Kept separate from docker-build-push on purpose: that workflow owns the
# release tags and only ever runs off master. Nothing in this file may write
# `latest`, and the string does not appear here at all.
name: docker-preview

on:
  push:
    branches-ignore: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    # Belt and braces: the release branch is served by docker-build-push.
    if: github.ref != 'refs/heads/master'
    env:
      # The Docker Hub namespace comes from the repository's own owner, so a
      # fork that runs this workflow publishes to its own namespace, never
      # the upstream one. Override with the repository variable
      # DOCKERHUB_NAMESPACE when the Docker Hub namespace differs from the
      # GitHub username.
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || github.repository_owner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tgdcfs
            dockerfile: Dockerfile
          - name: tgdcfs-fe
            dockerfile: Dockerfile.frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Ubuntu 26.04 runners stack the docker-default AppArmor profile
      # (docker-default//&unconfined), which denies signals between processes
      # inside a container. `next build` kills its build workers, so the
      # frontend image fails with "Error: kill EACCES" (moby/moby#54099).
      # Runners are single-use VMs, so relaxing the sysctl here is safe.
      - name: Allow signals inside build containers
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0

      - name: Prepare build
        id: prep
        env:
          # A step's env values are literal text, not shell-expanded, so
          # the namespace has to come from the env context here.
          REPOSITORY: ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.name }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # Tags come from the commit, never from the branch name, so they are
          # stable regardless of how a branch is called or renamed.
          short="${GITHUB_SHA::12}"
          image="${REPOSITORY}:preview-${short}"
          {
            echo "image=${image}"
            echo "tags=${REPOSITORY}:preview,${image}"
            # Publishing needs Docker Hub credentials. A repository without
            # those secrets (a fork that never set them) still builds and
            # smoke-tests, it just does not publish. The secrets are the
            # whole check: this runs on `push`, where only the repository
            # that owns them can read them, and a hard-coded owner name here
            # kept every fork from publishing to its own Docker Hub.
            echo "can_push=$([ -n "${DOCKERHUB_TOKEN}" ] && [ -n "${DOCKERHUB_USERNAME}" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64
          # Load into the local daemon first so the image can be exercised
          # before anything reaches the registry.
          load: true
          push: false
          tags: ${{ steps.prep.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Smoke test the SFTP server
        if: matrix.name == 'tgdcfs'
        run: |
          docker run --rm \
            -v "$PWD/scripts:/app/scripts:ro" \
            "${{ steps.prep.outputs.image }}" \
            python scripts/docker_smoke_check.py

      # An environment variable named wrong in the image is invisible to every
      # test in the suite -- it lives in the image, not in the code -- so check
      # it where it can be observed. The second run uses a uid with no passwd
      # entry, as `docker run --user $(id -u)` gives on most hosts: the whole
      # point of pinning the path is that it holds whoever the container runs
      # as, instead of being derived from HOME or a passwd lookup.
      - name: Check the image pins its data directory
        if: matrix.name == 'tgdcfs'
        env:
          EXPECTED: /home/tgdcfs/.tgdcfs
        run: |
          probe() {
            docker run --rm "$@" "${{ steps.prep.outputs.image }}" \
              python -c "from tgdcfs.config import DATA_DIR; print(DATA_DIR)"
          }
          for args in "" "--user 12345"; do
            # shellcheck disable=SC2086
            actual=$(probe $args)
            echo "data dir with '${args:-default user}': $actual"
            if [ "$actual" != "$EXPECTED" ]; then
              echo "::error::expected $EXPECTED, got $actual"
              exit 1
            fi
          done

      - name: Smoke test the frontend
        if: matrix.name == 'tgdcfs-fe'
        run: |
          docker run -d --name tgdcfs-fe-smoke -p 8080:80 \
            "${{ steps.prep.outputs.image }}"
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/tgdcfs/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          docker logs tgdcfs-fe-smoke
          docker rm -f tgdcfs-fe-smoke
          if [ "$code" != "200" ]; then
            echo "::error::the frontend did not serve /tgdcfs/ (last status: ${code:-none})"
            exit 1
          fi

      - name: Login to Docker Hub
        if: steps.prep.outputs.can_push == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push ${{ matrix.name }}
        if: steps.prep.outputs.can_push == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          # Everything is already in the cache from the build above, so this
          # only uploads layers.
          cache-from: type=gha

      - name: Summarise
        if: steps.prep.outputs.can_push == 'true'
        run: |
          {
            echo "### ${{ matrix.name }} preview image"
            echo
            echo '```bash'
            echo "docker pull ${{ steps.prep.outputs.image }}"
            echo '```'
            echo
            echo "Also tagged \`${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.name }}:preview\`, which moves with every"
            echo "feature-branch build. Use the commit-pinned tag above when that matters."
          } >> "$GITHUB_STEP_SUMMARY"
